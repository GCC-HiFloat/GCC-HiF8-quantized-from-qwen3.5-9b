task: sciq_ten
dataset_path: parquet
dataset_kwargs:
  data_files:
    test: /filesdir/eval_data/qwen35_ten/sciq/data/test-00000-of-00001.parquet
test_split: test
output_type: multiple_choice
doc_to_text: "{{support.lstrip()}}\nQuestion: {{question}}\nAnswer:"
doc_to_target: 3
doc_to_choice: "{{[distractor1, distractor2, distractor3, correct_answer]}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0-local-ten
